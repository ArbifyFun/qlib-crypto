name: Crypto Plugin Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  crypto-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run crypto release preflight
        run: |
          python -m qlib_crypto.release_preflight
