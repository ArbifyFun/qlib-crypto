qlib_init:
  provider_uri: ~/.qlib/crypto_data_1min
  region: crypto
  custom_ops:
    - class: FundingZScore
      module_path: qlib_crypto.contrib.ops.crypto_ops

market: &market all
benchmark: &benchmark BINANCE_BTCUSDT

data_handler_config: &data_handler_config
  start_time: 2024-01-01
  end_time: 2024-01-31
  fit_start_time: 2024-01-01
  fit_end_time: 2024-01-20
  instruments: *market
  freq: 1min
  infer_processors: []
  learn_processors:
    - class: DropnaLabel
    - class: CSZScoreNorm
      kwargs:
        fields_group: label

port_analysis_config: &port_analysis_config
  strategy:
    class: CryptoTopkStrategy
    module_path: qlib_crypto.contrib.strategy.signal_strategy
    kwargs:
      signal: <PRED>
      topk: 10
      n_drop: 2
      only_tradable: true
      hold_thresh: 0
  backtest:
    start_time: 2024-01-21
    end_time: 2024-01-31
    account: 1000000
    benchmark: *benchmark
    exchange_kwargs:
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0005
      min_cost: 0
      limit_threshold: null

task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      learning_rate: 0.05
      max_depth: 6
      num_leaves: 64
      num_threads: 8

  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158Crypto
        module_path: qlib_crypto.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        train: [2024-01-01, 2024-01-20]
        valid: [2024-01-21, 2024-01-25]
        test: [2024-01-26, 2024-01-31]

  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        ana_long_short: false
        ann_scaler: 525600
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        config: *port_analysis_config
